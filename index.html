<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数独直观解题器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; touch-action:manipulation; }
        body { background-color:#f5f5f5; display:flex; flex-direction:column; align-items:center; padding:20px; }
        h1 { color:#333; margin-bottom:8px; }

        .status-area {
            padding:10px 20px; background:#fff; border-radius:5px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1); min-height:40px;
            color:#333; font-size:16px; text-align:center;
            margin-bottom:12px; width:100%; max-width:411px; word-break:break-all;
        }

        .grid-wrapper { position:relative; display:inline-block; margin-bottom:10px; }

        .sudoku-container {
            display:grid;
            grid-template-columns:repeat(9,45px);
            grid-template-rows:repeat(9,45px);
            border:2px solid #000; gap:0;
        }

        #svgOverlay {
            position:absolute; top:0; left:0;
            pointer-events:none; z-index:20; overflow:visible;
        }

        .cell-wrapper { position:relative; width:45px; height:45px; overflow:hidden; }

        .background-block {
            position:absolute; top:0; left:0; width:100%; height:100%;
            z-index:1; border:1px solid #ccc; transition:background-color 0.15s;
        }

        .cell-wrapper:nth-child(n+1):nth-child(-n+27):nth-child(9n+1) .background-block,
        .cell-wrapper:nth-child(n+1):nth-child(-n+27):nth-child(9n+2) .background-block,
        .cell-wrapper:nth-child(n+1):nth-child(-n+27):nth-child(9n+3) .background-block{background-color:#e8e8e8}
        .cell-wrapper:nth-child(n+1):nth-child(-n+27):nth-child(9n+4) .background-block,
        .cell-wrapper:nth-child(n+1):nth-child(-n+27):nth-child(9n+5) .background-block,
        .cell-wrapper:nth-child(n+1):nth-child(-n+27):nth-child(9n+6) .background-block{background-color:#fff}
        .cell-wrapper:nth-child(n+1):nth-child(-n+27):nth-child(9n+7) .background-block,
        .cell-wrapper:nth-child(n+1):nth-child(-n+27):nth-child(9n+8) .background-block,
        .cell-wrapper:nth-child(n+1):nth-child(-n+27):nth-child(9n+9) .background-block{background-color:#e8e8e8}

        .cell-wrapper:nth-child(n+28):nth-child(-n+54):nth-child(9n+1) .background-block,
        .cell-wrapper:nth-child(n+28):nth-child(-n+54):nth-child(9n+2) .background-block,
        .cell-wrapper:nth-child(n+28):nth-child(-n+54):nth-child(9n+3) .background-block{background-color:#fff}
        .cell-wrapper:nth-child(n+28):nth-child(-n+54):nth-child(9n+4) .background-block,
        .cell-wrapper:nth-child(n+28):nth-child(-n+54):nth-child(9n+5) .background-block,
        .cell-wrapper:nth-child(n+28):nth-child(-n+54):nth-child(9n+6) .background-block{background-color:#e8e8e8}
        .cell-wrapper:nth-child(n+28):nth-child(-n+54):nth-child(9n+7) .background-block,
        .cell-wrapper:nth-child(n+28):nth-child(-n+54):nth-child(9n+8) .background-block,
        .cell-wrapper:nth-child(n+28):nth-child(-n+54):nth-child(9n+9) .background-block{background-color:#fff}

        .cell-wrapper:nth-child(n+55):nth-child(-n+81):nth-child(9n+1) .background-block,
        .cell-wrapper:nth-child(n+55):nth-child(-n+81):nth-child(9n+2) .background-block,
        .cell-wrapper:nth-child(n+55):nth-child(-n+81):nth-child(9n+3) .background-block{background-color:#e8e8e8}
        .cell-wrapper:nth-child(n+55):nth-child(-n+81):nth-child(9n+4) .background-block,
        .cell-wrapper:nth-child(n+55):nth-child(-n+81):nth-child(9n+5) .background-block,
        .cell-wrapper:nth-child(n+55):nth-child(-n+81):nth-child(9n+6) .background-block{background-color:#fff}
        .cell-wrapper:nth-child(n+55):nth-child(-n+81):nth-child(9n+7) .background-block,
        .cell-wrapper:nth-child(n+55):nth-child(-n+81):nth-child(9n+8) .background-block,
        .cell-wrapper:nth-child(n+55):nth-child(-n+81):nth-child(9n+9) .background-block{background-color:#e8e8e8}

        .cell-wrapper:nth-child(9n+3) .background-block{border-right:2px solid #000!important}
        .cell-wrapper:nth-child(9n+6) .background-block{border-right:2px solid #000!important}
        .cell-wrapper:nth-child(9n+9) .background-block{border-right:none!important}
        .cell-wrapper:nth-child(n+19):nth-child(-n+27) .background-block{border-bottom:2px solid #000!important}
        .cell-wrapper:nth-child(n+46):nth-child(-n+54) .background-block{border-bottom:2px solid #000!important}
        .cell-wrapper:nth-child(n+73):nth-child(-n+81) .background-block{border-bottom:none!important}

        .background-block.same-row-col{background-color:#d0d0d0!important}
        .background-block.target-hl{background-color:rgba(183,240,183,0.8)!important}

        .candidate-block {
            position:absolute; top:0; left:0; width:100%; height:100%;
            z-index:11; display:grid;
            grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
            pointer-events:none;
        }
        .candidate-num {
            font-size:8px; color:#333; text-align:center;
            line-height:15px; font-weight:600; position:relative;
        }
        .candidate-num.elim{ color:rgba(0,0,0,0.2); }
/* 不再在候选小格里画小X */
.candidate-num.elim::after { content:''; }
/* 在整格中央画大X（约75%视觉占比） */
.cell-wrapper.elim-cell::after{
    content:'×';
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:#ff0000;
    font-size:34px;      /* 45px格子的约75% */
    font-weight:700;
    line-height:1;
    z-index:18;
    pointer-events:none;
}

        .mark-layer { position:absolute; top:0; left:0; width:100%; height:100%; z-index:12; pointer-events:none; }
        .mark-circle {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            width:32px; height:32px; border:2px solid #ff0000; border-radius:50%;
        }

        .sudoku-input {
            position:absolute; top:0; left:0; width:100%; height:100%;
            z-index:10; text-align:center; font-size:24px;
            border:none; outline:none; background:transparent!important;
            -webkit-user-select:none; user-select:none; caret-color:transparent;
        }
        .sudoku-input.player-input{font-weight:bold;color:#0066cc}
        .sudoku-input.system-input{color:#cc3300;font-weight:bold}
        .sudoku-input.conflict{background-color:rgba(255,204,204,0.8)!important;color:#f00}
        .sudoku-input.active{background-color:rgba(183,240,183,0.8)!important;border:2px solid #66cc66!important}

        .number-selector{display:flex;gap:10px;margin:20px 0}
        .number-btn{width:45px;height:45px;font-size:20px;font-weight:bold;border:none;border-radius:5px;background-color:#fff;cursor:pointer;transition:background-color 0.2s}
        .number-btn:hover{background-color:#e0e0e0}
        .btn-group{display:flex;gap:15px;margin-bottom:20px}
        .btn-group button{padding:10px 20px;font-size:16px;font-weight:bold;border:none;border-radius:5px;cursor:pointer;transition:background-color 0.3s}
        .btn-group button:disabled{opacity:0.5;cursor:not-allowed}
        #backspace{background-color:#dc3545;color:#fff}
        #backspace:hover:not(:disabled){background-color:#c82333}
        #prevStep{background-color:#6c757d;color:#fff}
        #prevStep:hover:not(:disabled){background-color:#5a6268}
        #nextStep{background-color:#0066cc;color:#fff}
        #nextStep:hover:not(:disabled){background-color:#0052aa}
        #clearAll{background-color:#ff9900;color:#fff}
        #clearAll:hover:not(:disabled){background-color:#e68a00}
        #solveAll{background-color:#00cc66;color:#fff}
        #solveAll:hover:not(:disabled){background-color:#00b359}

        @media(max-width:500px){
            .sudoku-container{
                grid-template-columns:repeat(9,calc((100vw - 40px)/9));
                grid-template-rows:repeat(9,calc((100vw - 40px)/9));
            }
            .cell-wrapper{width:calc((100vw - 40px)/9);height:calc((100vw - 40px)/9)}
            .sudoku-input{font-size:18px}
            .candidate-num{font-size:6px!important;line-height:calc((100vw - 40px)/9/3)!important}
            .cell-wrapper.elim-cell::after{font-size:calc((100vw - 40px)/12)}
            .mark-circle{width:26px;height:26px}
            .number-selector{gap:8px;width:100%;justify-content:center}
            .number-btn{width:calc((100vw - 80px)/9);height:calc((100vw - 80px)/9);font-size:16px}
            .btn-group{flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
            .btn-group button{padding:8px 15px;font-size:14px}
            .status-area{font-size:14px}
            h1{font-size:20px;text-align:center}
        }
    </style>
</head>
<body>
    <h1>数独直观解题器</h1>
    <div class="status-area" id="statusArea">请输入数独初始数字，点击「下一步」开始解题</div>
    <div class="grid-wrapper" id="gridWrapper">
        <div class="sudoku-container" id="sudokuGrid"></div>
        <svg id="svgOverlay" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="arrowHead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
                <polygon points="0 0, 6 2, 0 4" fill="#ff0000"/>
            </marker></defs>
        </svg>
    </div>
    <div class="number-selector">
        <button class="number-btn" data-num="1">1</button>
        <button class="number-btn" data-num="2">2</button>
        <button class="number-btn" data-num="3">3</button>
        <button class="number-btn" data-num="4">4</button>
        <button class="number-btn" data-num="5">5</button>
        <button class="number-btn" data-num="6">6</button>
        <button class="number-btn" data-num="7">7</button>
        <button class="number-btn" data-num="8">8</button>
        <button class="number-btn" data-num="9">9</button>
    </div>
    <div class="btn-group">
        <button id="backspace">退格键</button>
        <button id="prevStep" disabled>上一步</button>
        <button id="nextStep">下一步</button>
        <button id="clearAll">一键清空</button>
        <button id="solveAll">一键全解</button>
    </div>

<script>
// ==================== 全局状态 ====================
var board = arr2d();
var candidates = arr3d();
var playerCells = new Set();
var inputHistory = [];
var solveSteps = [];
var stepIdx = -1;
var activeInput = null;
var correctSolution = null;
var phase = 'input';
var snapshotsForPrev = [];

function arr2d(){ return Array.from({length:9},function(){return Array(9).fill('')}) }
function arr3d(){ return Array.from({length:9},function(){return Array.from({length:9},function(){return new Set()})}) }
function deepCopy(b){ return b.map(function(r){return r.slice()}) }
function copyCands(c){ return c.map(function(r){return r.map(function(s){return new Set(s)})}) }
function validNum(n){ return typeof n==='string'&&/^[1-9]$/.test(n) }

// 统一安全写入：禁止 NaN/null/undefined/0 等无效值进入数据结构
function setBoardValue(bd, r, c, v){
    if(v!=='' && !validNum(v)) return false;
    bd[r][c]=v;
    return true;
}

// ==================== 初始化 ====================
window.onload = function(){
    buildGrid(); bindNumbers(); bindButtons(); updateBtnStates(); sizeSvg();
    window.addEventListener('resize', sizeSvg);
};

function sizeSvg(){
    var g=document.getElementById('sudokuGrid');
    var s=document.getElementById('svgOverlay');
    s.setAttribute('width',g.offsetWidth);
    s.setAttribute('height',g.offsetHeight);
    s.style.width=g.offsetWidth+'px';
    s.style.height=g.offsetHeight+'px';
}

// ==================== 构建网格 ====================
function buildGrid(){
    var grid=document.getElementById('sudokuGrid');
    grid.innerHTML='';
    for(var r=0;r<9;r++){
        for(var c=0;c<9;c++){
            var wrap=document.createElement('div');
            wrap.className='cell-wrapper';
            wrap.dataset.row=r; wrap.dataset.col=c;

            var bg=document.createElement('div');
            bg.className='background-block';
            wrap.appendChild(bg);

            var cb=document.createElement('div');
            cb.className='candidate-block';
            for(var n=1;n<=9;n++){
                var sp=document.createElement('span');
                sp.className='candidate-num';
                sp.dataset.pos=n; sp.textContent='';
                cb.appendChild(sp);
            }
            wrap.appendChild(cb);

            var ml=document.createElement('div');
            ml.className='mark-layer';
            wrap.appendChild(ml);

            var inp=document.createElement('input');
            inp.className='sudoku-input';
            inp.type='text'; inp.maxLength=1;
            inp.dataset.row=r; inp.dataset.col=c;
            inp.readOnly=true; inp.tabIndex=-1;

            (function(inp){
                inp.addEventListener('click',function(){
                    clearAllHighlights();
                    if(activeInput) activeInput.classList.remove('active');
                    activeInput=this;
                    this.classList.add('active');
                    hlRowCol(+this.dataset.row, +this.dataset.col);
                });
            })(inp);

            wrap.appendChild(inp);
            grid.appendChild(wrap);
        }
    }
}

// ==================== 高亮相关 ====================
function clearAllHighlights(){
    document.querySelectorAll('.background-block.same-row-col').forEach(function(b){b.classList.remove('same-row-col')});
    document.querySelectorAll('.background-block.target-hl').forEach(function(b){b.classList.remove('target-hl')});
}

function hlRowCol(row,col){
    for(var r=0;r<9;r++) for(var c=0;c<9;c++){
        if((r===row||c===col)&&!(r===row&&c===col)){
            getWrap(r,c).querySelector('.background-block').classList.add('same-row-col');
        }
    }
}

function getWrap(r,c){return document.querySelector('.cell-wrapper[data-row="'+r+'"][data-col="'+c+'"]')}
function getInp(r,c){return document.querySelector('.sudoku-input[data-row="'+r+'"][data-col="'+c+'"]')}
function setActiveCell(r,c){
    if(activeInput) activeInput.classList.remove('active');
    clearAllHighlights();
    var inp = getInp(r,c);
    if(!inp) return;
    activeInput = inp;
    inp.classList.add('active');
    hlRowCol(r,c);
}


// ==================== 数字输入 ====================
function bindNumbers(){
    document.querySelectorAll('.number-btn').forEach(function(btn){
        btn.addEventListener('click',function(){
            if(!activeInput||phase==='solving') return;
            var num=this.dataset.num;
            var r=+activeInput.dataset.row, c=+activeInput.dataset.col;
            if(board[r][c]===num) return;
            if(hasConflict(board,r,c,num)){
                activeInput.value=num;
                activeInput.classList.add('conflict');
                setStatus('冲突：填入的数字违反数独规则');
                return;
            }
            var old=board[r][c];
            inputHistory.push({r:r,c:c,old:old});
            if(!setBoardValue(board,r,c,num)) return;

            activeInput.value=num;
            activeInput.classList.add('player-input');
            activeInput.classList.remove('conflict','system-input');
            playerCells.add(r+','+c);
            clearCandDisplay(r,c);
            resetSolveState();
            setStatus('已输入，请继续或点击「下一步」');
            updateBtnStates();
        });
    });
}

// ==================== 按钮事件 ====================
function bindButtons(){
    document.getElementById('backspace').addEventListener('click', doBackspace);
    document.getElementById('prevStep').addEventListener('click', doPrev);
    document.getElementById('nextStep').addEventListener('click', doNext);
    document.getElementById('clearAll').addEventListener('click', doClear);
    document.getElementById('solveAll').addEventListener('click', doSolveAll);
}

function updateBtnStates(){
    document.getElementById('backspace').disabled=(inputHistory.length===0 && phase==='input');
    document.getElementById('prevStep').disabled=(stepIdx<0);
    document.getElementById('nextStep').disabled=false;
}

function setStatus(msg){ document.getElementById('statusArea').textContent=msg; }

function summarizeElimination(step){
    if(!step || !step.eliminatedCells || step.eliminatedCells.length===0){
        return '这一步是排除思路展示（暂无具体删减）';
    }

    var numSet = new Set();
    var removeCount = 0;

    step.eliminatedCells.forEach(function(item){
        var nums = item[2] || [];
        nums.forEach(function(n){
            numSet.add(n);
            removeCount++;
        });
    });

    var nums = Array.from(numSet).sort();
    if(nums.length===0){
        return '这一步是排除思路展示（暂无具体删减）';
    }

    if(nums.length===1){
        return '红圈先锁定候选 ' + nums[0] + ' → 同行/同列/同宫其余格删 ' + nums[0] + '（红叉，共' + removeCount + '处）';
    }

    return '红圈先锁定关键候选 → 同行/同列/同宫其余格删 ' + nums.join('、') + '（红叉，共' + removeCount + '处）';
}



// ==================== 退格键 ====================
function doBackspace(){
    if(phase==='solving'){ doPrev(); return; }
    if(inputHistory.length===0){ setStatus('无可删除的输入'); return; }
    var last=inputHistory.pop();
    setBoardValue(board,last.r,last.c,last.old||'');
    var inp=getInp(last.r,last.c);
    inp.value=last.old||'';
    if(last.old){inp.classList.add('player-input')}
    else{inp.classList.remove('player-input','system-input','conflict'); playerCells.delete(last.r+','+last.c)}
    resetSolveState();
    setStatus('已撤销上次输入');
    updateBtnStates();
}

// ==================== 一键清空 ====================
function doClear(){
    board=arr2d(); candidates=arr3d(); inputHistory=[];
    playerCells.clear(); resetSolveState(); phase='input';
    document.querySelectorAll('.sudoku-input').forEach(function(inp){
        inp.value=''; inp.classList.remove('player-input','system-input','active','conflict');
    });
    document.querySelectorAll('.candidate-num').forEach(function(s){s.textContent='';s.classList.remove('elim')});
    document.querySelectorAll('.mark-layer').forEach(function(m){m.innerHTML=''});
    clearAllHighlights(); clearSvg(); activeInput=null;
    setStatus('已清空所有数字，请重新输入');
    updateBtnStates();
}

// ==================== 一键全解 ====================
function doSolveAll(){
    var copy=deepCopy(board);
    if(!backtrackSolve(copy)){setStatus('当前数独无解');return}
    for(var r=0;r<9;r++) for(var c=0;c<9;c++){
        if(board[r][c]===''){
            if(!setBoardValue(board,r,c,copy[r][c])) return;
            var inp=getInp(r,c);
            inp.value=copy[r][c];
            inp.classList.add('system-input');
            clearCandDisplay(r,c);
        }
    }
    correctSolution=copy; phase='solving'; clearAllMarks();
    setStatus('数独已全部解答完成！');
    updateBtnStates();
}

// ==================== 下一步（逐帧：每次只执行1步） ====================
function doNext(){
    if(phase==='input'){
        var hasInput=board.some(function(r){return r.some(function(v){return v!==''})});
        if(!hasInput){setStatus('请先输入数独初始数字！');return}
        var copy=deepCopy(board);
        if(!backtrackSolve(copy)){setStatus('当前数独无解（数字有冲突）');return}
        correctSolution=copy;
        computeAllCandidates();
        renderAllCandidates();
        phase='candidates';
        setStatus('候选数已显示，再点「下一步」开始逐步解题');
        updateBtnStates();
        return;
    }
    else if(phase==='candidates'){
        generateAllSteps();
        if(solveSteps.length===0){setStatus('无法用逻辑方法解题，可使用「一键全解」');return}
        phase='solving'; stepIdx=-1; snapshotsForPrev=[];
    }

    if(phase==='solving'){
        if(stepIdx+1 >= solveSteps.length){
            var done=true;
            for(var r=0;r<9;r++) for(var c=0;c<9;c++) if(board[r][c]==='') done=false;
            if(done) setStatus('数独已全部解答完成！');
            else setStatus('逻辑方法已用尽，可使用「一键全解」');
            return;
        }
        snapshotsForPrev.push({board:deepCopy(board), cands:copyCands(candidates)});
        stepIdx++;
        applyStep(solveSteps[stepIdx]);
        updateBtnStates();
    }
}

// ==================== 上一步 ====================
function doPrev(){
    if(stepIdx<0) return;
    var snap=snapshotsForPrev.pop();
    board=snap.board; candidates=snap.cands;
    stepIdx--;
    refreshFullDisplay(); clearAllMarks();
    if(stepIdx>=0){
        showStepMarks(solveSteps[stepIdx]);
        if(solveSteps[stepIdx].type==='eliminate'){
            setStatus('排除：'+solveSteps[stepIdx].method+' ｜ '+summarizeElimination(solveSteps[stepIdx]));
        }else{
            setStatus('方法：'+solveSteps[stepIdx].method+'  →  填入数字'+solveSteps[stepIdx].value);
        }
    } else {
        setStatus('已回到初始候选数状态');
    }
    updateBtnStates();
}

// ==================== 应用一步 ====================
function applyStep(step){
    clearAllMarks();

    // 先清掉旧的“用户选中高亮”（灰色同行同列 + 绿框）
    if(activeInput) activeInput.classList.remove('active');
    clearAllHighlights();

    // 纯排除步骤
    if(step.type==='eliminate'){
        if(step.eliminatedCells){
            step.eliminatedCells.forEach(function(item){
                var r2=item[0],c2=item[1],nums=item[2];
                if(nums){
                    nums.forEach(function(n){ candidates[r2][c2].delete(n); });
                }
            });
        }
        renderAllCandidates();
        showStepMarks(step);
        setStatus('排除：'+step.method+' ｜ '+summarizeElimination(step));
        return;
    }

    // 填数字步骤
    var r=step.targetRow, c=step.targetCol, v=step.value;
    if(!validNum(v)){setStatus('内部错误：无效数字');return}

    if(step.eliminatedCells){
        step.eliminatedCells.forEach(function(item){
            var r2=item[0],c2=item[1],nums=item[2];
            if(nums){
                nums.forEach(function(n){ candidates[r2][c2].delete(n); });
            }
        });
    }

    if(!setBoardValue(board,r,c,v)){setStatus('内部错误：写入失败');return;}
    candidates[r][c]=new Set();

    var inp=getInp(r,c);
    inp.value=v;
    inp.classList.add('system-input');

    // 关键：把高亮“移动”到新生成数字的格子
    setActiveCell(r,c);

    clearCandDisplay(r,c);
    eliminateAfterPlace(r,c,v);
    renderAllCandidates();
    showStepMarks(step);
    setStatus('方法：'+step.method+'  →  填入数字'+v);
}

function showStepMarks(step){
    function keyOf(rc){ return rc[0] + ',' + rc[1]; }

    function uniqCells(arr){
        var map = {};
        var out = [];
        (arr || []).forEach(function(rc){
            if(!rc) return;
            var k = keyOf(rc);
            if(map[k]) return;
            map[k] = 1;
            out.push([rc[0], rc[1]]);
        });
        return out;
    }

    function centerOf(rc, gRect){
        var w = getWrap(rc[0], rc[1]);
        var rect = w.getBoundingClientRect();
        return {
            x: rect.left - gRect.left + rect.width/2,
            y: rect.top  - gRect.top  + rect.height/2
        };
    }

    function drawLine(svg, from, to, gRect, withArrow, width, opacity){
        var p1 = centerOf(from, gRect);
        var p2 = centerOf(to, gRect);
        var line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
        line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
        line.setAttribute('stroke', '#ff0000');
        line.setAttribute('stroke-width', width || 1.2);
        if(opacity!==undefined) line.setAttribute('opacity', opacity);
        if(withArrow) line.setAttribute('marker-end', 'url(#arrowHead)');
        svg.appendChild(line);
    }

    function addCircle(rc){
        var ml = getWrap(rc[0], rc[1]).querySelector('.mark-layer');
        var circle = document.createElement('div');
        circle.className = 'mark-circle';
        ml.appendChild(circle);
    }

    if(step.targetRow!==undefined && step.targetRow!==null){
        getWrap(step.targetRow,step.targetCol).querySelector('.background-block').classList.add('target-hl');
    }

    var related = uniqCells(step.relatedCells || []);
    var elimCells = uniqCells((step.eliminatedCells || []).map(function(it){ return [it[0], it[1]]; }));

    related.forEach(addCircle);

    if(step.eliminatedCells){
        step.eliminatedCells.forEach(function(item){
            var r2=item[0], c2=item[1], nums=item[2];
            getWrap(r2,c2).classList.add('elim-cell');
            if(nums){
                nums.forEach(function(n){
                    var el=getWrap(r2,c2).querySelector('.candidate-num[data-pos="'+n+'"]');
                    if(el){
                        el.textContent=n;
                        el.classList.add('elim');
                    }
                });
            }
        });
    }

    var svg=document.getElementById('svgOverlay');
    var grid=document.getElementById('sudokuGrid');
    var gRect=grid.getBoundingClientRect();

    // 填数步骤
    if(related.length>0 && step.targetRow!==undefined && step.targetRow!==null){
        var to = [step.targetRow, step.targetCol];
        related.forEach(function(rc){
            drawLine(svg, rc, to, gRect, true, 1.2, 0.95);
        });
        return;
    }

    // 纯排除步骤
    if(related.length===0 || elimCells.length===0) return;

    var lineGuard = {};
    function drawUnique(a,b,arrow,width,opacity){
        var k = keyOf(a)+'->'+keyOf(b)+'|'+(arrow?1:0);
        if(lineGuard[k]) return;
        lineGuard[k] = 1;
        drawLine(svg,a,b,gRect,arrow,width,opacity);
    }

    // related 结构线（更密集）
    for(var i=0;i<related.length;i++){
        for(var j=i+1;j<related.length;j++){
            drawUnique(related[i], related[j], false, 1.8, 0.7);
        }
    }

    // 证据格（已填数）
    var support = [];
    (step.eliminatedCells || []).forEach(function(item){
        var er=item[0], ec=item[1], nums=item[2]||[];
        nums.forEach(function(n){
            for(var rr=0;rr<9;rr++){
                for(var cc=0;cc<9;cc++){
                    if(board[rr][cc]===n && sees(rr,cc,er,ec)){
                        support.push([rr,cc]);
                    }
                }
            }
        });
    });

    support = uniqCells(support).filter(function(rc){
        return !elimCells.some(function(e){ return e[0]===rc[0] && e[1]===rc[1]; });
    });

    support.forEach(addCircle);

    var sources = uniqCells(related.concat(support));

    elimCells.forEach(function(e){
        var canSee = sources.filter(function(s){
            return !(s[0]===e[0] && s[1]===e[1]) && sees(s[0],s[1],e[0],e[1]);
        });

        if(canSee.length===0) canSee = related.slice();

        for(var k=0;k<Math.min(5, canSee.length);k++){
            drawUnique(canSee[k], e, true, 1.2, 0.95);
        }
    });
}

function eliminateAfterPlace(row,col,val){

    }
    var br=Math.floor(row/3)*3, bc=Math.floor(col/3)*3;
    for(var r=br;r<br+3;r++) for(var c=bc;c<bc+3;c++) candidates[r][c].delete(val);
}

// ==================== 冲突检测 ====================
function hasConflict(bd,row,col,num){
    if(!validNum(num)) return true;
    for(var i=0;i<9;i++){
        if(i!==col&&bd[row][i]===num) return true;
        if(i!==row&&bd[i][col]===num) return true;
    }
    var br=Math.floor(row/3)*3, bc=Math.floor(col/3)*3;
    for(var r=br;r<br+3;r++) for(var c=bc;c<bc+3;c++){
        if(r!==row||c!==col){ if(bd[r][c]===num) return true; }
    }
    return false;
}

// ==================== 回溯求解 ====================
function backtrackSolve(bd){
    var cell=null;
    for(var r=0;r<9;r++){for(var c=0;c<9;c++){if(bd[r][c]===''){cell=[r,c];break;}} if(cell)break;}
    if(!cell) return true;
    var row=cell[0],col=cell[1];
    for(var n=1;n<=9;n++){
        var ns=n.toString();
        if(!hasConflict(bd,row,col,ns)){
            bd[row][col]=ns;
            if(backtrackSolve(bd)) return true;
            bd[row][col]='';
        }
    }
    return false;
}

// ==================== 安全高级策略包装 ====================
function trySafeAdvanced(wb, wc, tryFunc){
    var backup = copyCands(wc);
    var result = tryFunc(wb, wc);

    if(!result){
        for(var r=0;r<9;r++) for(var c=0;c<9;c++) wc[r][c] = backup[r][c];
        return null;
    }

    if(result.eliminatedCells && correctSolution){
        var bad = false;
        result.eliminatedCells.forEach(function(item){
            var r2=item[0], c2=item[1], nums=item[2];
            if(nums && wb[r2][c2]===''){
                var correct = correctSolution[r2][c2];
                nums.forEach(function(n){
                    if(n === correct) bad = true;
                });
            }
        });
        if(bad){
            for(var rr=0;rr<9;rr++) for(var cc=0;cc<9;cc++) wc[rr][cc] = backup[rr][cc];
            return null;
        }
    }

    if(result.type !== 'eliminate' && correctSolution){
        if(result.value !== correctSolution[result.targetRow][result.targetCol]){
            for(var rr2=0;rr2<9;rr2++) for(var cc2=0;cc2<9;cc2++) wc[rr2][cc2] = backup[rr2][cc2];
            return null;
        }
    }

    return result;
}

// ==================== 解法优先级（按你要求分层） ====================
var STRATEGY_PIPELINE = [
    // 基础解法
    { name:'宫内排除法', fn:tryHiddenSingleBox, safe:false },
    { name:'行列排除法', fn:tryHiddenSingleRow, safe:false },
    { name:'行列排除法', fn:tryHiddenSingleCol, safe:false },
    { name:'区块排除法', fn:tryPointingElimination, safe:true },
    { name:'区块 + 行列排除法', fn:tryClaimingElimination, safe:true },

    // 进阶解法
    { name:'数对占位法', fn:tryHiddenPairAll, safe:true },
    { name:'唯余法', fn:tryNakedSingle, safe:false },
    { name:'行列 + 数对占位法', fn:tryNakedPairAll, safe:true },
    { name:'数组占位法', fn:tryHiddenTripleAll, safe:true },
    { name:'行列 + 数组占位法', fn:tryNakedTripleAll, safe:true },
    { name:'显性数对法', fn:tryNakedPairAll, safe:true },
    { name:'隐形数组法', fn:tryHiddenTripleAll, safe:true },

    // 高阶解法
    { name:'区块 + 唯余法', fn:tryPointingElimination, safe:true },
    { name:'行列 + 区块 + 唯余法', fn:tryClaimingElimination, safe:true },
    { name:'数组 + 区块法', fn:tryNakedTripleAll, safe:true },
    { name:'数组 + 区块 + 唯余法', fn:tryHiddenTripleAll, safe:true },
    { name:'数组 + 数组法', fn:tryHiddenTripleAll, safe:true },
    { name:'X-wings 法', fn:tryXWing, safe:true },
    { name:'剑鱼删减法（Swordfish）', fn:trySwordfish, safe:true },
    { name:'XY-wings 法', fn:tryXYWing, safe:true },
    { name:'Y-wings 法', fn:tryXYWing, safe:true }, // 先复用
    { name:'唯一矩形法', fn:tryUniqueRectangle, safe:true }
];

function runOneStrategy(strategy, wb, wc){
    var step = strategy.safe ? trySafeAdvanced(wb, wc, strategy.fn) : strategy.fn(wb, wc);
    if(!step) return null;
    // 所有“填数步骤”统一与 correctSolution 对齐，避免后续兜底冲突
    if(step.type!=='eliminate' && correctSolution){
        if(step.value !== correctSolution[step.targetRow][step.targetCol]){
            return null; // 这一步跳过，继续尝试后续策略
        }
    }
    step.method = strategy.name;
    return step;
}


function generateAllSteps(){
    solveSteps=[];
    var wb=deepCopy(board);
    var wc=copyCands(candidates);

    var maxIter=600, iter=0;
    while(iter++<maxIter){
        var done=true;
        for(var r=0;r<9;r++) for(var c=0;c<9;c++) if(wb[r][c]==='') done=false;
        if(done) break;

        var step=null;
        for(var i=0;i<STRATEGY_PIPELINE.length && !step;i++){
            step = runOneStrategy(STRATEGY_PIPELINE[i], wb, wc);
        }

        // 逻辑法全失败：兜底一步（不预填，只在这一步生成时填1格）
        if(!step){
            var best=null, bestSize=10;
            for(var rr=0;rr<9;rr++) for(var cc=0;cc<9;cc++){
                if(wb[rr][cc]!=='' ) continue;
                var sz=wc[rr][cc].size;
                if(sz>0 && sz<bestSize){
                    bestSize=sz; best=[rr,cc];
                }
            }
            if(!best) break; // 无空格或候选异常

            var tr=best[0], tc=best[1];
            var v = correctSolution ? correctSolution[tr][tc] : '';
            if(!validNum(v)) break;

            step = {
                targetRow:tr,
                targetCol:tc,
                value:v,
                method:'唯一解回填法',
                relatedCells:collectFilledPeers(wb,tr,tc),
                eliminatedCells:[]
            };
        }

        if(step.type==='eliminate'){
            solveSteps.push(step);
            continue;
        }

        if(!validNum(step.value)) break;
        if(correctSolution && step.type!=='eliminate' &&
   step.value !== correctSolution[step.targetRow][step.targetCol]) {
    continue; // 跳过这步，继续循环找别的步
}
        if(hasConflict(wb,step.targetRow,step.targetCol,step.value)) break;


        if(!setBoardValue(wb, step.targetRow, step.targetCol, step.value)) break;
        wc[step.targetRow][step.targetCol]=new Set();

        var sv=step.value;
        for(var k=0;k<9;k++){
            wc[step.targetRow][k].delete(sv);
            wc[k][step.targetCol].delete(sv);
        }
        var br2=Math.floor(step.targetRow/3)*3,bc2=Math.floor(step.targetCol/3)*3;
        for(var r2=br2;r2<br2+3;r2++) for(var c2=bc2;c2<bc2+3;c2++) wc[r2][c2].delete(sv);

        solveSteps.push(step);
    }
}


// ============ 辅助函数 ============
function setsEqual(a,b){
    if(a.size!==b.size) return false;
    var eq=true;
    a.forEach(function(v){if(!b.has(v)) eq=false});
    return eq;
}
function sees(r1,c1,r2,c2){
    if(r1===r2) return true;
    if(c1===c2) return true;
    if(Math.floor(r1/3)===Math.floor(r2/3)&&Math.floor(c1/3)===Math.floor(c2/3)) return true;
    return false;
}
function boxCells(r,c){
    var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3,res=[];
    for(var i=br;i<br+3;i++) for(var j=bc;j<bc+3;j++) res.push([i,j]);
    return res;
}
function rowCells(r){var res=[];for(var c=0;c<9;c++) res.push([r,c]);return res}
function colCells(c){var res=[];for(var r=0;r<9;r++) res.push([r,c]);return res}

function getPeers(r,c){
    var res=[],seen={};
    var add = function(rr,cc){
        if(rr===r&&cc===c) return;
        var k=rr+','+cc;
        if(seen[k]) return;
        seen[k]=1;
        res.push([rr,cc]);
    };
    for(var i=0;i<9;i++){add(r,i);add(i,c)}
    var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
    for(var rr=br;rr<br+3;rr++) for(var cc=bc;cc<bc+3;cc++) add(rr,cc);
    return res;
}

function findSingleInCands(wc,wb){
    for(var r=0;r<9;r++) for(var c=0;c<9;c++){
        if(wb[r][c]===''&&wc[r][c].size===1){
            var v=Array.from(wc[r][c])[0];
            if(validNum(v)) return {r:r,c:c,v:v};
        }
    }
    return null;
}

function collectFilledPeers(wb,r,c){
    var rel=[],seen={};
    var add = function(rr,cc){var k=rr+','+cc;if(!seen[k]){seen[k]=1;rel.push([rr,cc])}};
    for(var i=0;i<9;i++){
        if(wb[r][i]!==''&&i!==c) add(r,i);
        if(wb[i][c]!==''&&i!==r) add(i,c);
    }
    var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
    for(var rr=br;rr<br+3;rr++) for(var cc=bc;cc<bc+3;cc++){
        if(wb[rr][cc]!==''&&(rr!==r||cc!==c)) add(rr,cc);
    }
    return rel;
}

// ========== 1. 唯一候选数法 (Naked Single) ==========
function tryNakedSingle(wb,wc){
    for(var r=0;r<9;r++) for(var c=0;c<9;c++){
        if(wb[r][c]!==''||wc[r][c].size!==1) continue;
        var v=Array.from(wc[r][c])[0];
        if(!validNum(v)) continue;
        var rel=collectFilledPeers(wb,r,c);
        return {targetRow:r,targetCol:c,value:v,
            method:'唯一候选数法(该格只剩数字'+v+')',
            relatedCells:rel,eliminatedCells:[]};
    }
    return null;
}

// ========== 2. 宫内隐性唯一 (Hidden Single in Box) ==========
function tryHiddenSingleBox(wb,wc){
    for(var br=0;br<9;br+=3) for(var bc=0;bc<9;bc+=3){
        for(var n=1;n<=9;n++){
            var ns=n.toString();
            var exists=false;
            for(var r=br;r<br+3;r++) for(var c=bc;c<bc+3;c++) if(wb[r][c]===ns) exists=true;
            if(exists) continue;
            var pos=[];
            for(var r2=br;r2<br+3;r2++) for(var c2=bc;c2<bc+3;c2++){
                if(wb[r2][c2]===''&&wc[r2][c2].has(ns)) pos.push([r2,c2]);
            }
            if(pos.length===1){
                var tr=pos[0][0],tc=pos[0][1];
                var rel = collectFilledPeers(wb,tr,tc);
                var elim=[];
                for(var rr2=br;rr2<br+3;rr2++) for(var cc2=bc;cc2<bc+3;cc2++){
    if(rr2===tr && cc2===tc) continue;
    if(wb[rr2][cc2]==='' && wc[rr2][cc2].has(ns)) {
        elim.push([rr2,cc2,[ns]]);
    }
}
                return {targetRow:tr,targetCol:tc,value:ns,
                    method:'宫内排除法(数字'+ns+'在该宫只能放在此格)',
                    relatedCells:rel,eliminatedCells:elim};
            }
        }
    }
    return null;
}

// ========== 3. 行内隐性唯一 (Hidden Single in Row) ==========
function tryHiddenSingleRow(wb,wc){
    for(var r=0;r<9;r++){
        for(var n=1;n<=9;n++){
            var ns=n.toString();
            var exists=false;
            for(var c=0;c<9;c++) if(wb[r][c]===ns) exists=true;
            if(exists) continue;
            var pos=[];
            for(var c2=0;c2<9;c2++) if(wb[r][c2]===''&&wc[r][c2].has(ns)) pos.push([r,c2]);
            if(pos.length===1){
                var tr=pos[0][0],tc=pos[0][1];
                var rel = collectFilledPeers(wb,tr,tc);
                var elim=[];
                for(var cc2=0;cc2<9;cc2++){
    if(cc2===tc || wb[r][cc2]!=='') continue;
    if(wc[r][cc2].has(ns)) {
        elim.push([r,cc2,[ns]]);
    }
}
                return {targetRow:tr,targetCol:tc,value:ns,
                    method:'行排除法(数字'+ns+'在第'+(r+1)+'行只能放在此格)',
                    relatedCells:rel,eliminatedCells:elim};
            }
        }
    }
    return null;
}

// ========== 4. 列内隐性唯一 (Hidden Single in Col) ==========
function tryHiddenSingleCol(wb,wc){
    for(var c=0;c<9;c++){
        for(var n=1;n<=9;n++){
            var ns=n.toString();
            var exists=false;
            for(var r=0;r<9;r++) if(wb[r][c]===ns) exists=true;
            if(exists) continue;
            var pos=[];
            for(var r2=0;r2<9;r2++) if(wb[r2][c]===''&&wc[r2][c].has(ns)) pos.push([r2,c]);
            if(pos.length===1){
                var tr=pos[0][0],tc=pos[0][1];
                var rel = collectFilledPeers(wb,tr,tc);
                var elim=[];
                for(var rr2=0;rr2<9;rr2++){
    if(rr2===tr || wb[rr2][c]!=='') continue;
    if(wc[rr2][c].has(ns)) {
        elim.push([rr2,c,[ns]]);
    }
}
                return {targetRow:tr,targetCol:tc,value:ns,
                    method:'列排除法(数字'+ns+'在第'+(c+1)+'列只能放在此格)',
                    relatedCells:rel,eliminatedCells:elim};
            }
        }
    }
    return null;
}

// ========== 5. Pointing ==========
function tryPointingElimination(wb,wc){
    for(var br=0;br<9;br+=3) for(var bc=0;bc<9;bc+=3){

                if(sees(rr,cc,w1[0],w1[1])&&sees(rr,cc,w2[0],w2[1])){
                    elim.push([rr,cc,[elimVal]]);
                    wc[rr][cc].delete(elimVal);
                    changed=true;
                }
            }
            if(changed){
                var single=findSingleInCands(wc,wb);
                if(single){
                    return {targetRow:single.r,targetCol:single.c,value:single.v,
                        method:'XY-Wing(枢纽'+pVals.join('')+',排除'+elimVal+')→'+single.v+'唯一',
                        relatedCells:[pivot,w1,w2],eliminatedCells:elim};
                }
                return {type:'eliminate',
                    method:'XY-Wing(枢纽'+pVals.join('')+',排除'+elimVal+')排除候选数',
                    relatedCells:[pivot,w1,w2],eliminatedCells:elim};
            }
        }
    }
    return null;
}

// ========== 14. Unique Rectangle ==========
function tryUniqueRectangle(wb,wc){
    for(var r1=0;r1<9;r1++) for(var r2=r1+1;r2<9;r2++){
        for(var c1=0;c1<9;c1++) for(var c2=c1+1;c2<9;c2++){
            var b1=Math.floor(r1/3)*3+Math.floor(c1/3);
            var b2=Math.floor(r1/3)*3+Math.floor(c2/3);
            var b3=Math.floor(r2/3)*3+Math.floor(c1/3);
            var b4=Math.floor(r2/3)*3+Math.floor(c2/3);
            var boxes=new Set([b1,b2,b3,b4]);
            if(boxes.size!==2) continue;

            var corners=[[r1,c1],[r1,c2],[r2,c1],[r2,c2]];
            for(var t=0;t<4;t++){
                var others=corners.filter(function(_,idx){return idx!==t});
                var target=corners[t];
                var allValid=others.every(function(rc){
                    return wb[rc[0]][rc[1]]===''&&wc[rc[0]][rc[1]].size===2;
                });
                if(!allValid) continue;
                var s0=wc[others[0][0]][others[0][1]];
                var allSame=others.every(function(rc){return setsEqual(wc[rc[0]][rc[1]],s0)});
                if(!allSame) continue;
                if(wb[target[0]][target[1]]!=='') continue;
                var tCands=wc[target[0]][target[1]];
                var pairVals=Array.from(s0);
                if(!tCands.has(pairVals[0])||!tCands.has(pairVals[1])) continue;
                if(tCands.size<=2) continue;

                var elim=[];
                var removed=[];
                pairVals.forEach(function(v){
                    if(tCands.has(v)){removed.push(v);tCands.delete(v);}
                });
                if(removed.length>0) elim.push([target[0],target[1],removed]);

                if(tCands.size===1){
                    var v=Array.from(tCands)[0];
                    if(validNum(v)){
                        return {targetRow:target[0],targetCol:target[1],value:v,
                            method:'唯一矩形Type1(数对'+pairVals.join(',')+')排除→'+v+'唯一',
                            relatedCells:others,eliminatedCells:elim};
                    }
                }

                var single=findSingleInCands(wc,wb);
                if(single){
                    return {targetRow:single.r,targetCol:single.c,value:single.v,
                        method:'唯一矩形Type1(数对'+pairVals.join(',')+')排除→'+single.v+'唯一',
                        relatedCells:others,eliminatedCells:elim};
                }

                if(elim.length>0){
                    return {type:'eliminate',
                        method:'唯一矩形Type1(数对'+pairVals.join(',')+')排除候选数',
                        relatedCells:others,eliminatedCells:elim};
                }
            }
        }
    }
    return null;
}
